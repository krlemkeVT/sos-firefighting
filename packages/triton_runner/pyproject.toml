[project]
name = "triton-runner"
version = "0.1.0"
description = "Case and batch execution runner for TRITON"
requires-python = ">=3.10"
dependencies = [
    "triton-api",
    "triton-io",
    "sosid",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
